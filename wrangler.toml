name = "github-backup-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 自定义域名路由,替换为你在worker设置中绑定的域名
# 如没你的worker没有绑定自定义域名，请用#注释掉以下三行内容。
routes = [
  { pattern = "fkgit.ai99cn.com/*", zone_name = "ai99cn.com" }
]

# 绑定 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "github-backup-db"
database_id = "66666f4a-d0f9-486d-8541-137199dd8468" # 替换为你的 D1 Database ID

# 绑定 R2 存储桶
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "github-backup-bucket" # 替换为你的 R2 Bucket Name

[[kv_namespaces]]
binding = "KV"
id = "7109ce428e324caa821c8bd2722a236b" # 替换为你自己创建的 KV 命名空间 ID

# 其他敏感环境变量提示 (通过 wrangler secret put 设置，不要硬编码在这里)
# GITHUB_TOKEN: 你的 GitHub Personal Access Token
# WEBHOOK_SECRET: GitHub Webhook 的 Secret
# ADMIN_PASSWORD: 管理面板登录密码
